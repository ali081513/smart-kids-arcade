<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小朋友智力大挑戰 🧠 Smart Kids Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+HK:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Nunito', 'Noto Sans HK', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-hover { transition: transform 0.1s, box-shadow 0.1s; cursor: pointer; }
        .btn-hover:active { transform: scale(0.95); }
        
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .game-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
        @media (min-width: 1024px) { .game-grid { grid-template-columns: repeat(5, 1fr); } }

        .board-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 320px; margin: 0 auto; }
        .ttt-cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: white; border-radius: 16px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1); cursor: pointer; }
        
        .simon-btn { aspect-ratio: 1/1; border-radius: 20px; opacity: 0.7; transition: opacity 0.2s; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2); cursor: pointer;}
        .simon-btn.active { opacity: 1; box-shadow: inset 0 0 20px rgba(255,255,255,0.8); }

        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s; }
    </style>
</head>
<body class="p-2 sm:p-6 flex flex-col items-center min-h-screen pt-16">

    <!-- TOP BAR (Fixed Language Toggle) -->
    <div class="fixed top-0 left-0 w-full p-4 flex justify-end z-40 pointer-events-none">
        <button id="lang-toggle" onclick="toggleLanguage()" class="pointer-events-auto btn-hover bg-white/90 backdrop-blur text-purple-600 font-black py-2 px-6 rounded-full shadow-lg border-b-4 border-purple-200 flex items-center gap-2 transition-all">
            🌐 English
        </button>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu" class="w-full max-w-6xl bg-white/90 backdrop-blur p-4 sm:p-8 rounded-[2rem] shadow-2xl animate-pop relative">
        <div class="text-center mb-8">
            <h1 id="menu-title" class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-blue-500 mb-2 drop-shadow-sm">🧠 小朋友智力大挑戰</h1>
            <p id="menu-sub" class="text-gray-600 font-bold text-lg">10款升級大腦遊戲，考驗你嘅智慧！</p>
        </div>
        <div id="games-grid" class="game-grid"></div>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container" class="hidden w-full max-w-3xl bg-white/95 backdrop-blur p-4 sm:p-8 rounded-[2rem] shadow-2xl relative">
        <div class="flex justify-between items-center mb-6 border-b-4 border-gray-100 pb-4">
            <button onclick="goHome()" class="btn-hover bg-gray-200 text-gray-700 font-black px-4 py-2 sm:px-6 sm:py-3 rounded-full flex items-center gap-2 shadow-sm">
                <span>⬅️</span> <span id="back-btn-txt" class="hidden sm:inline">返回主目錄</span>
            </button>
            <h2 id="game-title" class="text-2xl sm:text-4xl font-black text-gray-800 absolute left-1/2 transform -translate-x-1/2 w-max"></h2>
            <div class="w-24"></div>
        </div>
        <div id="game-area" class="min-h-[400px] flex flex-col items-center justify-center w-full"></div>
    </div>

    <!-- CUSTOM MODAL -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full border-4 border-yellow-400 transform transition-all duration-300 scale-95 opacity-0" id="modal-content">
            <div id="modal-icon" class="text-6xl mb-4">🎉</div>
            <h3 id="modal-title" class="text-3xl font-black text-blue-600 mb-2"></h3>
            <div id="modal-desc" class="text-xl text-gray-700 font-bold mb-6"></div>
            <button id="modal-btn-txt" onclick="closeModal()" class="btn-hover w-full bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black py-3 px-8 rounded-full shadow-lg border-b-4 border-yellow-600 text-xl">
                繼續！ 👍
            </button>
        </div>
    </div>

    <script>
        let currentLang = 'zh'; 
        let activeGame = null;
        let availableVoices = [];

        // Fetch voices (Works better across different browsers)
        function loadVoices() { availableVoices = window.speechSynthesis.getVoices(); }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices(); 
        }

        function playTTS(zhText, enText) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); 
            
            let textToRead = currentLang === 'zh' ? zhText : enText;
            let utterance = new SpeechSynthesisUtterance(textToRead);
            
            if(availableVoices.length === 0) loadVoices(); 

            let voice = null;
            if (currentLang === 'zh') {
                voice = availableVoices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue-HK')) ||
                        availableVoices.find(v => v.lang.includes('zh'));
            } else {
                voice = availableVoices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB')) ||
                        availableVoices.find(v => v.lang.includes('en'));
            }
            
            if (voice) utterance.voice = voice;
            utterance.rate = 0.85; 
            utterance.pitch = 1.2; 
            window.speechSynthesis.speak(utterance);
        }

        const dict = {
            menuTitle: { zh: '🧠 小朋友智力大挑戰', en: '🧠 Smart Kids Arcade' },
            menuSub: { zh: '10款升級大腦遊戲，考驗你嘅智慧！', en: '10 upgraded brain games to challenge you!' },
            backBtn: { zh: '返回主目錄', en: 'Back to Menu' },
            langBtn: { zh: '🌐 English', en: '🌐 繁體中文' },
            modalBtn: { zh: '繼續！ 👍', en: 'Continue! 👍' },
            scoreText: { zh: '分數', en: 'Score' },
            timeText: { zh: '時間', en: 'Time' },
            correct: { zh: '啱啦！', en: 'Correct!' },
            wrong: { zh: '唔啱喎', en: 'Wrong!' },
            done: { zh: '完成！', en: 'Done!' },
            draw: { zh: '打和！', en: 'Draw!' },
            youWin: { zh: '你贏咗！', en: 'You Win!' },
            youLose: { zh: '輸咗！', en: 'You Lose!' }
        };

        function loc(key) { return dict[key] ? dict[key][currentLang] : key; }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateStaticUI();
            if (activeGame) {
                clearAllTimers();
                document.getElementById('game-title').textContent = `${activeGame.icon} ${currentLang === 'zh' ? activeGame.zh : activeGame.en}`;
                activeGame.init();
            } else {
                renderMenu();
            }
        }

        function updateStaticUI() {
            document.getElementById('lang-toggle').innerHTML = loc('langBtn');
            document.getElementById('menu-title').textContent = loc('menuTitle');
            document.getElementById('menu-sub').textContent = loc('menuSub');
            document.getElementById('back-btn-txt').textContent = loc('backBtn');
            document.getElementById('modal-btn-txt').textContent = loc('modalBtn');
        }

        let activeIntervals = [], activeTimeouts = [];
        function registerInterval(fn, time) { let id = setInterval(fn, time); activeIntervals.push(id); return id; }
        function registerTimeout(fn, time) { let id = setTimeout(fn, time); activeTimeouts.push(id); return id; }
        function clearAllTimers() {
            activeIntervals.forEach(clearInterval); activeTimeouts.forEach(clearTimeout);
            activeIntervals = []; activeTimeouts = []; window.onkeydown = null;
        }

        const modal = document.getElementById('custom-modal');
        const modalContent = document.getElementById('modal-content');
        let modalCallback = null;
        
        function showModal(icon, title, desc, callback = null) {
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').innerHTML = desc;
            modalCallback = callback;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }
        
        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                if(modalCallback) modalCallback();
            }, 300);
        }

        const gameArea = document.getElementById('game-area');
        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

        // 1. Advanced Math (Level 1 & 2)
        function initMath() {
            let score = 0, rounds = 0, mode = null;
            
            function selectMode() {
                let title = currentLang === 'zh' ? '揀個難度啦！' : 'Select Level!';
                let l1 = currentLang === 'zh' ? 'Level 1 (選擇題)' : 'Level 1 (MCQ)';
                let l2 = currentLang === 'zh' ? 'Level 2 (自己填)' : 'Level 2 (Type)';
                gameArea.innerHTML = `
                    <div class="text-3xl font-black mb-8 text-gray-700">${title}</div>
                    <div class="flex flex-col gap-6 w-full max-w-sm">
                        <button class="btn-hover bg-green-100 border-4 border-green-300 text-green-700 font-black text-2xl py-6 rounded-3xl" onclick="startMathMode(1)">${l1}</button>
                        <button class="btn-hover bg-red-100 border-4 border-red-300 text-red-700 font-black text-2xl py-6 rounded-3xl" onclick="startMathMode(2)">${l2}</button>
                    </div>
                `;
            }
            
            window.startMathMode = (m) => { mode = m; nextQ(); };

            function nextQ() {
                if(rounds >= 5) {
                    let text = currentLang === 'zh' ? `答啱咗 ${score}/5 題！` : `You got ${score}/5!`;
                    return showModal('🎓', loc('done'), text, () => openGame(activeGame));
                }
                rounds++;
                let qText = currentLang === 'zh' ? `第 ${rounds}/5 題` : `Q ${rounds}/5`;
                
                let isAdd = Math.random() > 0.5;
                let n1, n2, ans, op;
                if(isAdd) {
                    n1 = randInt(10, 50); n2 = randInt(10, 50); ans = n1+n2; op = '+';
                } else {
                    n1 = randInt(30, 99); n2 = randInt(10, n1-1); ans = n1-n2; op = '-';
                }

                let baseHTML = `
                    <div class="text-xl font-bold mb-4 text-gray-500">${qText} | ${loc('scoreText')}: ${score}</div>
                    <div class="text-6xl font-black text-purple-600 mb-8 tracking-widest">${n1} ${op} ${n2} = ?</div>
                `;

                if(mode === 1) {
                    gameArea.innerHTML = baseHTML + `<div class="grid grid-cols-2 gap-4 w-full max-w-sm" id="math-opts"></div>`;
                    let optsGrid = document.getElementById('math-opts');
                    let opts = new Set([ans]);
                    while(opts.size < 4) {
                        let fake = ans + randInt(-10, 10);
                        if(fake > 0 && fake !== ans) opts.add(fake);
                    }
                    shuffle(Array.from(opts)).forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'btn-hover bg-white border-4 border-purple-200 text-3xl font-bold py-6 rounded-2xl shadow-sm text-gray-700';
                        btn.textContent = opt;
                        btn.onclick = () => checkAns(opt, ans);
                        optsGrid.appendChild(btn);
                    });
                } else {
                    // Level 2: iPad-friendly Virtual Numpad (using onpointerdown for instant touch response)
                    gameArea.innerHTML = baseHTML + `
                        <div class="w-full max-w-xs flex flex-col items-center">
                            <div id="math-input" class="w-full h-16 bg-white border-4 border-yellow-400 rounded-2xl mb-4 text-4xl font-black flex items-center justify-center text-gray-800"></div>
                            <div class="grid grid-cols-3 gap-2 w-full mb-4">
                                ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="btn-hover bg-gray-100 border-b-4 border-gray-300 text-3xl font-black py-4 rounded-xl touch-manipulation select-none" onpointerdown="event.preventDefault(); typeMath(${n})">${n}</button>`).join('')}
                                <button class="btn-hover bg-red-100 border-b-4 border-red-300 text-xl font-black py-4 rounded-xl text-red-600 touch-manipulation select-none" onpointerdown="event.preventDefault(); typeMath('C')">C</button>
                                <button class="btn-hover bg-gray-100 border-b-4 border-gray-300 text-3xl font-black py-4 rounded-xl touch-manipulation select-none" onpointerdown="event.preventDefault(); typeMath(0)">0</button>
                                <button class="btn-hover bg-green-100 border-b-4 border-green-300 text-2xl font-black py-4 rounded-xl text-green-700 touch-manipulation select-none" onpointerdown="event.preventDefault(); submitMath(${ans})">OK</button>
                            </div>
                        </div>
                    `;
                    window.currentMathInput = "";
                    window.typeMath = (val) => {
                        if(val === 'C') window.currentMathInput = "";
                        else if(window.currentMathInput.length < 3) window.currentMathInput += val;
                        document.getElementById('math-input').textContent = window.currentMathInput;
                    };
                    window.submitMath = (correct) => {
                        if(window.currentMathInput === "") return;
                        checkAns(parseInt(window.currentMathInput), correct);
                    };
                }
            }
            
            function checkAns(userAns, correctAns) {
                if(userAns === correctAns) { 
                    score++; showModal('✅', loc('correct'), '', nextQ); 
                } else { 
                    let t = currentLang === 'zh' ? `正確答案係 ${correctAns}！` : `Correct answer is ${correctAns}!`;
                    showModal('❌', loc('wrong'), t, nextQ); 
                }
            }
            
            selectMode();
        }

        // 2. Guess Number (1-100)
        function initGuessNum() {
            let target = randInt(1, 100), attempts = 0;
            let history = []; 
            let prompt = currentLang === 'zh' ? '諗緊1到100... 估下係咩？' : 'Thinking of 1-100... Guess!';
            let btnTxt = currentLang === 'zh' ? '估！' : 'Guess';
            let histTitle = currentLang === 'zh' ? '估過嘅數字：' : 'Guessed Numbers:';
            
            gameArea.innerHTML = `
                <div class="text-2xl font-bold text-gray-700 mb-6 text-center">${prompt}</div>
                <input type="number" id="guess-input" class="text-4xl text-center border-4 border-yellow-400 rounded-2xl w-48 py-4 mb-4 font-black" min="1" max="100">
                <button id="guess-btn" class="btn-hover bg-yellow-400 text-yellow-900 font-black text-2xl py-3 px-8 rounded-full shadow-lg border-b-4 border-yellow-600">${btnTxt}</button>
                <div id="guess-hint" class="mt-4 text-3xl font-black text-pink-500 h-10"></div>
                <div class="text-gray-400 font-bold mt-4 text-sm">${histTitle}</div>
                <div id="guess-history" class="mt-2 flex flex-wrap gap-2 justify-center max-w-sm min-h-[40px]"></div>
            `;
            
            document.getElementById('guess-btn').onclick = () => {
                let val = parseInt(document.getElementById('guess-input').value);
                let hint = document.getElementById('guess-hint');
                let histBox = document.getElementById('guess-history');
                
                if(!val || val<1 || val>100) return;
                
                if(history.includes(val)) {
                    hint.textContent = currentLang === 'zh' ? '估過啦！試第二個！' : 'Already guessed!';
                    hint.classList.remove('animate-shake'); void hint.offsetWidth; hint.classList.add('animate-shake');
                    document.getElementById('guess-input').value = '';
                    return;
                }
                
                attempts++;
                history.push(val); 
                
                histBox.innerHTML = history.map(n => `<span class="bg-gray-200 text-gray-600 px-3 py-1 rounded-full text-lg font-bold shadow-inner">${n}</span>`).join('');
                
                if(val === target) {
                    let t = currentLang === 'zh' ? `估咗 ${attempts} 次就中！` : `Got it in ${attempts} tries!`;
                    showModal('🎉', loc('correct'), t, initGuessNum);
                } else {
                    hint.textContent = val > target ? (currentLang==='zh'?'👇 太大啦！':'👇 Too high!') : (currentLang==='zh'?'👆 太細啦！':'👆 Too low!');
                    hint.classList.remove('animate-shake'); void hint.offsetWidth; hint.classList.add('animate-shake');
                }
                document.getElementById('guess-input').value = '';
                document.getElementById('guess-input').focus(); 
            };
        }

        // 3. Tic Tac Toe (Smarter CPU)
        function initTTT() {
            let board = Array(9).fill(null), gameOver = false;
            gameArea.innerHTML = `<div class="board-3x3 bg-gray-300 p-2 rounded-2xl" id="ttt-board"></div>`;
            const bEl = document.getElementById('ttt-board');
            
            function render() {
                bEl.innerHTML = '';
                board.forEach((c, i) => {
                    let d = document.createElement('div'); d.className = `ttt-cell font-black ${c==='⭕'?'text-blue-500':'text-red-500'}`;
                    d.textContent = c || ''; d.onclick = () => { if(!c && !gameOver) play(i); }; bEl.appendChild(d);
                });
            }
            function checkWin(b) {
                const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                for(let l of lines) if(b[l[0]] && b[l[0]]===b[l[1]] && b[l[0]]===b[l[2]]) return b[l[0]];
                if(!b.includes(null)) return 'draw'; return null;
            }
            function getBestMove() {
                const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                for(let l of lines) {
                    let [a,b,c] = l;
                    if(board[a]==='❌' && board[b]==='❌' && !board[c]) return c;
                    if(board[a]==='❌' && board[c]==='❌' && !board[b]) return b;
                    if(board[b]==='❌' && board[c]==='❌' && !board[a]) return a;
                }
                for(let l of lines) {
                    let [a,b,c] = l;
                    if(board[a]==='⭕' && board[b]==='⭕' && !board[c]) return c;
                    if(board[a]==='⭕' && board[c]==='⭕' && !board[b]) return b;
                    if(board[b]==='⭕' && board[c]==='⭕' && !board[a]) return a;
                }
                let e = board.map((c,idx)=>c===null?idx:null).filter(c=>c!==null);
                if(e.includes(4)) return 4;
                return e[randInt(0, e.length-1)];
            }
            function play(i) {
                board[i] = '⭕'; render(); let w = checkWin(board); if(w) return end(w);
                let e = board.map((c,idx)=>c===null?idx:null).filter(c=>c!==null);
                if(e.length > 0) {
                    board[getBestMove()] = '❌';
                    setTimeout(() => { render(); w = checkWin(board); if(w) end(w); }, 300);
                }
            }
            function end(r) {
                gameOver = true;
                setTimeout(() => {
                    if(r==='draw') showModal('🤝', loc('draw'), '', initTTT);
                    else if(r==='⭕') showModal('🎉', loc('youWin'), '', initTTT);
                    else showModal('🤖', loc('youLose'), '', initTTT);
                }, 100);
            }
            render();
        }

        // 4. Simon Says
        function initSimon() {
            let seq = [], user = [], lvl = 0;
            const cols = ['bg-red-500', 'bg-green-500', 'bg-blue-500', 'bg-yellow-400'];
            gameArea.innerHTML = `
                <div class="text-2xl font-bold text-gray-600 mb-6">${currentLang==='zh'?'記住次序！':'Remember Pattern!'}<br>Level: <span id="s-level">1</span></div>
                <div class="grid grid-cols-2 gap-4 w-full max-w-xs">${[0,1,2,3].map(i=>`<div id="btn-${i}" class="simon-btn ${cols[i]} border-4 border-gray-100"></div>`).join('')}</div>
                <div id="s-msg" class="mt-6 text-xl font-bold text-blue-500 h-8">準備...</div>
            `;
            async function flash(id) {
                let b = document.getElementById(`btn-${id}`); b.classList.add('active');
                await new Promise(r => registerTimeout(r, 400)); b.classList.remove('active');
                await new Promise(r => registerTimeout(r, 200));
            }
            async function next() {
                user = []; lvl++; document.getElementById('s-level').textContent = lvl; seq.push(randInt(0,3));
                document.getElementById('s-msg').textContent = currentLang==='zh'?'睇清楚👀...':'Watch👀...';
                gameArea.style.pointerEvents = 'none';
                await new Promise(r => registerTimeout(r, 800));
                for(let c of seq) await flash(c);
                gameArea.style.pointerEvents = 'auto';
                document.getElementById('s-msg').textContent = currentLang==='zh'?'到你啦👇':'Your turn👇';
            }
            for(let i=0; i<4; i++) {
                document.getElementById(`btn-${i}`).onclick = () => {
                    flash(i); user.push(i);
                    if(user[user.length-1] !== seq[user.length-1]) showModal('💥', loc('wrong'), `Level ${lvl}`, initSimon);
                    else if(user.length === seq.length) registerTimeout(next, 1000);
                };
            }
            registerTimeout(next, 1000);
        }

        // 5. Pattern Logic
        function initPattern() {
            let score = 0, rounds = 0;
            const pieces = ['🍎','🍌','🍇','🍓','🍉','🥝'];
            function nextPattern() {
                if(rounds >= 5) return showModal('🧠', loc('done'), `${loc('scoreText')}: ${score}/5`, initPattern);
                rounds++;
                
                let p1 = pieces[randInt(0, pieces.length-1)];
                let p2 = pieces[randInt(0, pieces.length-1)];
                while(p1===p2) p2 = pieces[randInt(0, pieces.length-1)];
                
                let patterns = [
                    [p1, p2, p1, p2, p1, p2],
                    [p1, p1, p2, p1, p1, p2],
                    [p1, p2, p2, p1, p2, p2]
                ];
                let chosen = patterns[randInt(0, patterns.length-1)];
                let display = chosen.slice(0, 4);
                let answer = chosen[4];
                
                let pText = currentLang === 'zh' ? '下一個係咩？' : 'What comes next?';
                gameArea.innerHTML = `
                    <div class="text-xl font-bold mb-4 text-gray-500">${pText} | ${loc('scoreText')}: ${score}/5</div>
                    <div class="flex gap-2 mb-12 bg-white p-4 rounded-full shadow-inner border-4 border-gray-100 text-5xl">
                        ${display.map(d=>`<div>${d}</div>`).join('')} <div>❓</div>
                    </div>

        // 8. Snake Game (Responsive Canvas & onpointerdown D-pad)
        function initSnake() {
            let pText = currentLang === 'zh' ? '用方向掣控制蛇蛇🍎' : 'Use controls to eat 🍎';
            gameArea.innerHTML = `
                <div class="text-gray-500 font-bold mb-2 text-center text-sm">${pText}</div>
                <div class="flex justify-between w-full max-w-[300px] mb-2 text-xl font-black">
                    <div class="text-amber-600">${loc('scoreText')}: <span id="snk-score">0</span></div>
                </div>
                <canvas id="snake-canvas" width="300" height="300" class="bg-green-100 border-4 border-green-500 rounded-lg shadow-inner touch-none mb-4"></canvas>
                <div class="grid grid-cols-3 gap-2 w-full max-w-[200px]">
                    <div></div>
                    <button id="snk-up" class="bg-blue-100 border-b-4 border-blue-300 text-3xl p-4 rounded-xl btn-hover flex items-center justify-center select-none touch-manipulation">⬆️</button>
                    <div></div>
                    <button id="snk-left" class="bg-blue-100 border-b-4 border-blue-300 text-3xl p-4 rounded-xl btn-hover flex items-center justify-center select-none touch-manipulation">⬅️</button>
                    <button id="snk-down" class="bg-blue-100 border-b-4 border-blue-300 text-3xl p-4 rounded-xl btn-hover flex items-center justify-center select-none touch-manipulation">⬇️</button>
                    <button id="snk-right" class="bg-blue-100 border-b-4 border-blue-300 text-3xl p-4 rounded-xl btn-hover flex items-center justify-center select-none touch-manipulation">➡️</button>
                </div>
            `;
            
            const cvs = document.getElementById('snake-canvas');
            const ctx = cvs.getContext('2d');
            let gridSize = 15;
            let tileCount = cvs.width / gridSize;
            let snake = [{x: 10, y: 10}], food = {x: 5, y: 5};
            let dx = 0, dy = 0, score = 0;
            let gameLoop;
            
            function draw() {
                let head = {x: snake[0].x + dx, y: snake[0].y + dy};
                
                if(head.x < 0) head.x = tileCount-1;
                if(head.x >= tileCount) head.x = 0;
                if(head.y < 0) head.y = tileCount-1;
                if(head.y >= tileCount) head.y = 0;

                if(dx !== 0 || dy !== 0) {
                    for(let i=0; i<snake.length; i++) {
                        if(head.x === snake[i].x && head.y === snake[i].y) {
                            clearInterval(gameLoop);
                            return showModal('💥', loc('done'), `${loc('scoreText')}: ${score}`, initSnake);
                        }
                    }
                }
                
                snake.unshift(head);
                
                if(head.x === food.x && head.y === food.y) {
                    score++; document.getElementById('snk-score').textContent = score;
                    food = {x: randInt(0, tileCount-1), y: randInt(0, tileCount-1)};
                } else {
                    if(dx !== 0 || dy !== 0) snake.pop();
                }
                
                ctx.fillStyle = '#dcfce7'; 
                ctx.fillRect(0,0, cvs.width, cvs.height);
                
                ctx.fillStyle = '#ef4444'; 
                ctx.fillRect(food.x*gridSize, food.y*gridSize, gridSize-2, gridSize-2);
                
                ctx.fillStyle = '#22c55e'; 
                snake.forEach(p => {
                    ctx.fillRect(p.x*gridSize, p.y*gridSize, gridSize-2, gridSize-2);
                });
            }
            
            gameLoop = registerInterval(draw, 120);
            
            function changeDir(newDx, newDy) {
                if(newDx !== 0 && dx === 0) { dx = newDx; dy = 0; }
                if(newDy !== 0 && dy === 0) { dx = 0; dy = newDy; }
            }

            window.onkeydown = (e) => {
                if(e.key==='ArrowUp') changeDir(0, -1);
                if(e.key==='ArrowDown') changeDir(0, 1);
                if(e.key==='ArrowLeft') changeDir(-1, 0);
                if(e.key==='ArrowRight') changeDir(1, 0);
            };

            // Using onpointerdown for instant touch response on iPad
            const bindBtn = (id, nx, ny) => {
                const btn = document.getElementById(id);
                btn.onpointerdown = (e) => { e.preventDefault(); changeDir(nx, ny); };
            };
            bindBtn('snk-up', 0, -1);
            bindBtn('snk-down', 0, 1);
            bindBtn('snk-left', -1, 0);
            bindBtn('snk-right', 1, 0);
        }

            { id: 3, zh: '聰明過三關', en: 'Smart TTT', icon: '⭕', color: 'bg-amber-100 border-amber-300 text-amber-700', init: initTTT },
            { id: 4, zh: '記憶顏色', en: 'Simon Says', icon: '🎨', color: 'bg-green-100 border-green-300 text-green-700', init: initSimon },
            { id: 5, zh: '規律邏輯', en: 'Pattern', icon: '🧩', color: 'bg-emerald-100 border-emerald-300 text-emerald-700', init: initPattern },
            { id: 6, zh: '英文串字', en: 'Scramble', icon: '🔤', color: 'bg-teal-100 border-teal-300 text-teal-700', init: initScramble },
            { id: 7, zh: '運算符號', en: 'Math Sign', icon: '➕', color: 'bg-cyan-100 border-cyan-300 text-cyan-700', init: initMathSign },
            { id: 8, zh: '貪食蛇', en: 'Snake', icon: '🐍', color: 'bg-sky-100 border-sky-300 text-sky-700', init: initSnake },
            { id: 9, zh: '打地鼠(炸彈)', en: 'Whack Mole', icon: '🐹', color: 'bg-blue-100 border-blue-300 text-blue-700', init: initMole },
            { id: 10, zh: '學中文(發音)', en: 'Learn Chinese', icon: '📚', color: 'bg-purple-100 border-purple-300 text-purple-700', init: initLearnChinese }
        ];

        function renderMenu() {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';
            games.forEach(g => {
                const btn = document.createElement('button');
                btn.className = `btn-hover ${g.color} border-b-4 rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm h-32 w-full`;
                btn.innerHTML = `<span class="text-4xl mb-2">${g.icon}</span><span class="font-bold text-sm sm:text-base whitespace-nowrap">${currentLang === 'zh' ? g.zh : g.en}</span>`;
                btn.onclick = () => openGame(g);
                grid.appendChild(btn);
            });
        }

        function openGame(game) {
            activeGame = game;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('game-title').textContent = `${game.icon} ${currentLang === 'zh' ? game.zh : game.en}`;
            gameArea.innerHTML = ''; 
            clearAllTimers();
            game.init(); 
        }

        function goHome() {
            activeGame = null;
            clearAllTimers();
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        updateStaticUI();
        renderMenu();

    </script>
</body>
</html>
